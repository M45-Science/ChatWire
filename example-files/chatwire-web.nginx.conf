# Include from nginx's http context. Replace hostname and certificate paths.
# cw-web-config.json: listen = 127.0.0.1:8787
#                     public_origin = https://chatwire.example.org
# ChatWire itself serves plain HTTP; nginx owns the certificates.
server {
    listen 80;
    server_name chatwire.example.org;
    return 308 https://chatwire.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name chatwire.example.org;
    ssl_certificate /etc/letsencrypt/live/chatwire.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatwire.example.org/privkey.pem;

    client_max_body_size 512m;
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Forward the browser's actual Origin for ChatWire's CSRF checks.
        proxy_set_header Origin $http_origin;
        proxy_cache off;
        proxy_buffering off;          # Deliver SSE events immediately.
        proxy_request_buffering off;  # Stream uploads to ChatWire.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
